<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M8 3h11l5 5v21a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z' fill='%23f7f5ef' stroke='%231b1b18' stroke-width='1.3'/%3E%3Cpath d='M19 3v5h5' fill='none' stroke='%231b1b18' stroke-width='1.3'/%3E%3Cpath d='M11.5 18.5a5 5 0 0 1 8.3-3.7' fill='none' stroke='%2312305a' stroke-width='1.8' stroke-linecap='round'/%3E%3Cpath d='M19.2 13.4l1-3.2 2.9 1.4' fill='none' stroke='%2312305a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M20.5 19.5a5 5 0 0 1-8.3 3.7' fill='none' stroke='%23808076' stroke-width='1.8' stroke-linecap='round'/%3E%3Cpath d='M12.8 24.6l-1-3.2-2.9 1.4' fill='none' stroke='%23808076' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />

    <style>
      /* Misma paleta Win98 que sisop.html, para que la ventana embebida no
         desentone con el resto del escritorio. */
      :root {
        --w98-face: #c9c5bb;
        --w98-face-lite: #e4e1d8;
        --w98-hilite: #ffffff;
        --w98-shadow: #808076;
        --w98-dkshadow: #3a3a34;
        --w98-field: #f7f5ef;
        --w98-selbg: #12305a;
        --w98-seltext: #f0ece4;
        --texto: #1b1b18;
        --apagado: #55554a;
        --alerta: #8c2f1f;
        --sans:
          "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas,
          monospace;

        /* Bisel "elevado" (botones en reposo) y su inverso "hundido"
           (pozos de contenido, estado presionado): mismas 4 capas que
           usa sisop.html para .btn / .tb-btn, nada inventado acá. */
        --bisel-elevado:
          inset -1px -1px 0 0 var(--w98-dkshadow),
          inset 1px 1px 0 0 var(--w98-hilite),
          inset -2px -2px 0 0 var(--w98-shadow),
          inset 2px 2px 0 0 var(--w98-face-lite);
        --bisel-hundido:
          inset 1px 1px 0 0 var(--w98-dkshadow),
          inset -1px -1px 0 0 var(--w98-hilite),
          inset 2px 2px 0 0 var(--w98-shadow),
          inset -2px -2px 0 0 var(--w98-face-lite);
      }

      * {
        box-sizing: border-box;
        cursor: default;
      }

      a,
      button {
        cursor: pointer;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--w98-field);
        color: var(--texto);
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 34rem;
        margin: 0 auto;
        padding: 2.5rem 1.5rem 4rem;
      }

      /* ---------- marca ---------- */

      .marca {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }

      .marca-icono {
        width: 1.6rem;
        height: 1.6rem;
        flex: none;
      }

      .marca-texto {
        font-weight: 700;
        font-size: 1rem;
        letter-spacing: 0.04em;
        color: var(--texto);
      }

      /* ---------- selector de modo ---------- */

      .selector {
        display: flex;
        gap: 0.3rem;
        flex-wrap: wrap;
      }

      .modo {
        padding: 0.5rem 0.9rem;
        border: 0;
        background: var(--w98-face);
        box-shadow: var(--bisel-elevado);
        font: inherit;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--texto);
        cursor: pointer;
      }

      .modo.activo {
        background: var(--w98-selbg);
        color: var(--w98-seltext);
        box-shadow: var(--bisel-hundido);
      }

      .modo:disabled {
        cursor: default;
        color: var(--w98-shadow);
        text-shadow: 1px 1px 0 var(--w98-hilite);
      }

      .modo:focus-visible {
        outline: 1px dotted var(--w98-dkshadow);
        outline-offset: -4px;
      }

      /* ---------- encabezado ---------- */

      h1 {
        font-family: var(--sans);
        font-size: 1.7rem;
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: -0.01em;
        margin: 1.5rem 0 0;
      }

      h1 .flecha {
        color: var(--w98-selbg);
      }

      .bajada {
        margin: 0.6rem 0 0;
        max-width: 26rem;
        color: var(--apagado);
        font-size: 0.9rem;
      }

      /* ---------- zona de archivo ---------- */

      .zona {
        margin-top: 2rem;
        border: 2px dashed var(--w98-selbg);
        background: var(--w98-field);
        box-shadow: var(--bisel-hundido);
        padding: 1.5rem 1.25rem;
        cursor: pointer;
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        color: inherit;
      }

      .zona.encima {
        background: var(--w98-face-lite);
      }

      .zona:focus-visible {
        outline: 1px dotted var(--w98-dkshadow);
        outline-offset: -4px;
      }

      .zona:disabled {
        cursor: default;
        color: var(--w98-shadow);
      }

      .zona-titulo {
        font-weight: 700;
      }

      .zona-detalle {
        margin-top: 0.35rem;
        color: var(--apagado);
        font-size: 0.85rem;
        word-break: break-word;
      }

      .lista-archivos {
        margin: 0.75rem 0 0;
        max-height: 11rem;
        overflow-y: auto;
        border-top: 1px solid var(--w98-shadow);
        border-bottom: 1px solid var(--w98-hilite);
      }

      .lista-archivos .fila {
        display: flex;
        gap: 0.6rem;
        padding: 0.35rem 0;
        border-bottom: 1px solid var(--w98-face-lite);
        font-size: 0.8rem;
      }

      .lista-archivos .num {
        color: var(--apagado);
        font-variant-numeric: tabular-nums;
        flex: none;
      }

      .lista-archivos .nom {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      input[type="file"] {
        display: none;
      }

      /* ---------- boton principal ---------- */

      .convertir {
        margin-top: 1rem;
        width: 100%;
        padding: 0.8rem 1rem;
        border: 0;
        background: var(--w98-face);
        box-shadow: var(--bisel-elevado);
        color: var(--texto);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .convertir:active:not(:disabled) {
        box-shadow: var(--bisel-hundido);
      }
      .convertir:disabled {
        color: var(--w98-shadow);
        text-shadow: 1px 1px 0 var(--w98-hilite);
        cursor: default;
      }
      .convertir:focus-visible {
        outline: 1px dotted var(--w98-dkshadow);
        outline-offset: -4px;
      }

      /* ---------- estado ---------- */

      .estado {
        margin-top: 2.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--w98-shadow);
      }

      .estado[hidden] {
        display: none;
      }

      .linea {
        display: flex;
        align-items: baseline;
        gap: 0.6rem;
        font-family: var(--sans);
        font-size: 1.2rem;
        font-weight: 700;
      }

      .punto {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: var(--w98-selbg);
        flex: none;
        transform: translateY(-0.15rem);
      }

      .trabajando .punto {
        animation: latido 1.4s ease-in-out infinite;
      }
      .fallo .punto {
        background: var(--alerta);
      }
      .fallo .linea {
        color: var(--alerta);
      }

      @keyframes latido {
        50% {
          opacity: 0.2;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .trabajando .punto {
          animation: none;
        }
      }

      .reloj {
        margin-left: auto;
        font-family: var(--sans);
        font-size: 0.85rem;
        font-weight: 400;
        font-variant-numeric: tabular-nums;
        color: var(--apagado);
      }

      .nota {
        margin: 0.5rem 0 0;
        color: var(--apagado);
        font-size: 0.85rem;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .acciones {
        margin-top: 1.25rem;
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
      }

      .descargar {
        display: inline-block;
        padding: 0.7rem 1.3rem;
        background: var(--w98-face);
        box-shadow: var(--bisel-elevado);
        color: var(--texto);
        text-decoration: none;
        font-weight: 700;
      }

      .descargar:active {
        box-shadow: var(--bisel-hundido);
      }

      .otro {
        padding: 0.7rem 1.3rem;
        border: 0;
        background: var(--w98-face);
        box-shadow: var(--bisel-elevado);
        font: inherit;
        cursor: pointer;
        color: var(--texto);
      }

      .otro:active {
        box-shadow: var(--bisel-hundido);
      }

      .descargar:focus-visible,
      .otro:focus-visible {
        outline: 1px dotted var(--w98-dkshadow);
        outline-offset: -4px;
      }

      footer {
        margin-top: 3rem;
        color: var(--apagado);
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="marca">
        <svg class="marca-icono" viewBox="0 0 32 32" aria-hidden="true">
          <path
            d="M8 3h11l5 5v21a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"
            fill="#f7f5ef"
            stroke="#1b1b18"
            stroke-width="1.3"
          />
          <path d="M19 3v5h5" fill="none" stroke="#1b1b18" stroke-width="1.3" />
          <path
            d="M11.5 18.5a5 5 0 0 1 8.3-3.7"
            fill="none"
            stroke="#12305a"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <path
            d="M19.2 13.4l1-3.2 2.9 1.4"
            fill="none"
            stroke="#12305a"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M20.5 19.5a5 5 0 0 1-8.3 3.7"
            fill="none"
            stroke="#808076"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <path
            d="M12.8 24.6l-1-3.2-2.9 1.4"
            fill="none"
            stroke="#808076"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="marca-texto">Formator</span>
      </div>

      <div class="selector" id="selector">
        <button type="button" class="modo" data-modo="pdf-a-epub">
          PDF → EPUB
        </button>
        <button type="button" class="modo" data-modo="imagen-a-pdf">
          Imagen → PDF
        </button>
        <button type="button" class="modo" data-modo="doc-a-pdf">
          Documento → PDF
        </button>
      </div>

      <h1 id="titulo"></h1>
      <p class="bajada" id="bajada"></p>

      <input type="file" id="archivo" />

      <button type="button" class="zona" id="zona">
        <span class="zona-titulo" id="zonaTitulo"></span>
        <span class="zona-detalle" id="zonaDetalle"></span>
        <div class="lista-archivos" id="listaArchivos" hidden></div>
      </button>

      <button type="button" class="convertir" id="convertir" disabled>
        Convertir
      </button>

      <section class="estado" id="estado" hidden aria-live="polite">
        <div class="linea">
          <span class="punto"></span>
          <span id="estadoTexto">En cola</span>
          <span class="reloj" id="reloj"></span>
        </div>
        <p class="nota" id="nota"></p>
        <div class="acciones" id="acciones" hidden>
          <a class="descargar" id="descargar" href="#">Descargar</a>
          <button type="button" class="otro" id="otro">Convertir otro</button>
        </div>
      </section>

      <footer id="pie"></footer>
    </main>

    <script>
      (function () {
        "use strict";

        const MODOS = {
          "pdf-a-epub": {
            titulo: 'De PDF <span class="flecha">a EPUB</span>',
            bajada: "Elegí un PDF y lo convertimos a EPUB.",
            accept: ".pdf,application/pdf",
            multiple: false,
            regex: /\.pdf$/i,
            invalido: "Ese archivo no es un PDF.",
            zonaVacia: "Elegí un PDF",
            zonaVaciaDetalle: "o arrastralo hasta acá",
            uno: "PDF elegido",
            varios: null,
            descargaLabel: "Descargar EPUB",
          },
          "imagen-a-pdf": {
            titulo: 'De imágenes <span class="flecha">a PDF</span>',
            bajada:
              "Elegí una o varias imágenes (JPG o PNG) y se convierten en un solo PDF, una página por imagen, en el orden en que las elegiste.",
            accept: ".jpg,.jpeg,.png,image/jpeg,image/png",
            multiple: true,
            regex: /\.(jpe?g|png)$/i,
            invalido: "Eso no son imágenes JPG o PNG.",
            zonaVacia: "Elegí una o más imágenes",
            zonaVaciaDetalle: "o arrastralas hasta acá",
            uno: "imagen elegida",
            varios: "imágenes elegidas",
            descargaLabel: "Descargar PDF",
          },
          "doc-a-pdf": {
            titulo: 'De documento <span class="flecha">a PDF</span>',
            bajada:
              "Elegí un documento de texto (TXT, DOCX, ODT o RTF) y se convierte a PDF.",
            accept: ".txt,.docx,.odt,.rtf",
            multiple: false,
            regex: /\.(txt|docx|odt|rtf)$/i,
            invalido: "Ese archivo no es un TXT, DOCX, ODT ni RTF.",
            zonaVacia: "Elegí un documento",
            zonaVaciaDetalle: "o arrastralo hasta acá",
            uno: "documento elegido",
            varios: null,
            descargaLabel: "Descargar PDF",
          },
        };

        const botonesModo = document.querySelectorAll(".modo");
        const titulo = document.getElementById("titulo");
        const bajada = document.getElementById("bajada");
        const entrada = document.getElementById("archivo");
        const zona = document.getElementById("zona");
        const zonaTitulo = document.getElementById("zonaTitulo");
        const zonaDetalle = document.getElementById("zonaDetalle");
        const listaArchivos = document.getElementById("listaArchivos");
        const botonEnviar = document.getElementById("convertir");
        const panel = document.getElementById("estado");
        const texto = document.getElementById("estadoTexto");
        const nota = document.getElementById("nota");
        const reloj = document.getElementById("reloj");
        const acciones = document.getElementById("acciones");
        const enlace = document.getElementById("descargar");
        const botonOtro = document.getElementById("otro");
        const pie = document.getElementById("pie");

        const ESPERA_MS = 2000; // cada cuanto le preguntamos al servidor
        let modoActual = "pdf-a-epub";
        let elegidos = [];
        let cronometro = null;
        let arranque = 0;

        // ---------- utilidades ----------

        function tamano(bytes) {
          const mb = bytes / (1024 * 1024);
          return mb >= 1
            ? mb.toFixed(1) + " MB"
            : Math.max(1, Math.round(bytes / 1024)) + " KB";
        }

        function escapar(texto) {
          const d = document.createElement("div");
          d.textContent = texto;
          return d.innerHTML;
        }

        function iniciarReloj() {
          arranque = Date.now();
          reloj.textContent = "0:00";
          cronometro = setInterval(function () {
            const seg = Math.floor((Date.now() - arranque) / 1000);
            reloj.textContent =
              Math.floor(seg / 60) + ":" + String(seg % 60).padStart(2, "0");
          }, 1000);
        }

        function pararReloj() {
          clearInterval(cronometro);
          cronometro = null;
        }

        function pintar(clase, titulo, detalle) {
          panel.hidden = false;
          panel.className = "estado" + (clase ? " " + clase : "");
          texto.textContent = titulo;
          nota.textContent = detalle || "";
        }

        function fallar(detalle) {
          pararReloj();
          pintar("fallo", "No se pudo convertir", detalle);
          acciones.hidden = false;
          enlace.hidden = true;
          botonEnviar.disabled = false;
          zona.disabled = false;
          botonesModo.forEach(function (boton) {
            boton.disabled = false;
          });
        }

        // ---------- cambio de modo ----------

        function elegirModo(modo) {
          modoActual = modo;
          const config = MODOS[modo];

          botonesModo.forEach(function (boton) {
            boton.classList.toggle("activo", boton.dataset.modo === modo);
          });

          titulo.innerHTML = config.titulo;
          bajada.textContent = config.bajada;
          entrada.accept = config.accept;
          entrada.multiple = config.multiple;
          enlace.textContent = config.descargaLabel;

          elegidos = [];
          entrada.value = "";
          zonaTitulo.textContent = config.zonaVacia;
          zonaDetalle.textContent = config.zonaVaciaDetalle;
          listaArchivos.hidden = true;
          listaArchivos.innerHTML = "";
          zona.disabled = false;
          botonEnviar.disabled = true;
          panel.hidden = true;
          pararReloj();
        }

        botonesModo.forEach(function (boton) {
          boton.addEventListener("click", function () {
            elegirModo(boton.dataset.modo);
          });
        });

        // ---------- eleccion de los archivos ----------

        function tomar(archivos) {
          const config = MODOS[modoActual];
          const lista = Array.from(archivos || []);
          if (!lista.length) return;

          let validos = lista.filter(function (archivo) {
            return config.regex.test(archivo.name);
          });
          if (!validos.length) {
            zonaDetalle.textContent = config.invalido;
            return;
          }

          let recorte = false;
          if (!config.multiple && validos.length > 1) {
            validos = validos.slice(0, 1);
            recorte = true;
          }

          elegidos = validos;

          const totalBytes = validos.reduce(function (suma, a) {
            return suma + a.size;
          }, 0);

          zonaTitulo.textContent =
            validos.length === 1
              ? "1 " + config.uno
              : validos.length + " " + config.varios;

          let notaExtra = "";
          if (recorte) {
            notaExtra = " · se usó solo el primero";
          } else if (validos.length < lista.length) {
            notaExtra =
              " · se ignoraron " +
              (lista.length - validos.length) +
              " que no valían";
          }
          zonaDetalle.textContent = tamano(totalBytes) + notaExtra;

          if (validos.length > 1) {
            listaArchivos.innerHTML = validos
              .map(function (archivo, indice) {
                return (
                  '<div class="fila"><span class="num">' +
                  (indice + 1) +
                  '.</span><span class="nom">' +
                  escapar(archivo.name) +
                  "</span></div>"
                );
              })
              .join("");
            listaArchivos.hidden = false;
          } else {
            listaArchivos.hidden = true;
            listaArchivos.innerHTML = "";
          }

          botonEnviar.disabled = false;
        }

        zona.addEventListener("click", function () {
          entrada.click();
        });
        entrada.addEventListener("change", function () {
          tomar(entrada.files);
        });

        ["dragenter", "dragover"].forEach(function (evento) {
          zona.addEventListener(evento, function (e) {
            e.preventDefault();
            zona.classList.add("encima");
          });
        });

        ["dragleave", "drop"].forEach(function (evento) {
          zona.addEventListener(evento, function (e) {
            e.preventDefault();
            zona.classList.remove("encima");
          });
        });

        zona.addEventListener("drop", function (e) {
          if (e.dataTransfer.files.length) tomar(e.dataTransfer.files);
        });

        // ---------- 1) subir ----------

        botonEnviar.addEventListener("click", async function () {
          if (!elegidos.length) return;
          const config = MODOS[modoActual];

          botonEnviar.disabled = true;
          zona.disabled = true;
          botonesModo.forEach(function (boton) {
            boton.disabled = true;
          });
          acciones.hidden = true;
          enlace.hidden = false;
          const detalle =
            elegidos.length === 1
              ? elegidos[0].name
              : elegidos.length + " " + config.varios;
          pintar("trabajando", "Subiendo", detalle);
          iniciarReloj();

          const cuerpo = new FormData();
          elegidos.forEach(function (archivo) {
            cuerpo.append("archivos", archivo);
          });

          let trabajo;
          try {
            const respuesta = await fetch("/convert/" + modoActual, {
              method: "POST",
              body: cuerpo,
            });
            if (!respuesta.ok) {
              const error = await respuesta.json().catch(function () {
                return {};
              });
              fallar(
                error.detail ||
                  "El servidor respondió " + respuesta.status + ".",
              );
              return;
            }
            trabajo = await respuesta.json();
          } catch (error) {
            fallar(
              "No se pudo contactar al servidor. Fijate que siga corriendo.",
            );
            return;
          }

          pintar("trabajando", "En cola", detalle);
          consultar(trabajo.id);
        });

        // ---------- 2) preguntar el estado ----------

        function etiqueta(trabajo) {
          if (trabajo.cantidad === 1) return trabajo.archivo;
          const config = MODOS[trabajo.tipo] || {};
          return trabajo.cantidad + " " + (config.varios || "archivos");
        }

        async function consultar(id) {
          let trabajo;
          try {
            const respuesta = await fetch("/jobs/" + id);
            if (respuesta.status === 404) {
              fallar(
                "El servidor se reinició y perdió este trabajo. Probá de nuevo.",
              );
              return;
            }
            trabajo = await respuesta.json();
          } catch (error) {
            fallar("Se cortó la conexión con el servidor.");
            return;
          }

          if (trabajo.estado === "completado") {
            pararReloj();
            pintar("", "Listo", etiqueta(trabajo));
            enlace.href = "/jobs/" + id + "/descarga";
            enlace.hidden = false;
            acciones.hidden = false;
            botonesModo.forEach(function (boton) {
              boton.disabled = false;
            });
            return;
          }

          if (trabajo.estado === "error") {
            fallar(trabajo.error || "La conversión no devolvió un motivo.");
            return;
          }

          pintar(
            "trabajando",
            trabajo.estado === "en_cola" ? "En cola" : "Convirtiendo",
            etiqueta(trabajo),
          );
          setTimeout(function () {
            consultar(id);
          }, ESPERA_MS);
        }

        // ---------- 3) volver a empezar ----------

        botonOtro.addEventListener("click", function () {
          elegirModo(modoActual);
        });

        // ---------- estado del servidor ----------

        fetch("/health")
          .then(function (r) {
            return r.json();
          })
          .then(function (salud) {
            pie.textContent =
              salud.estado === "ok"
                ? "Servidor listo. Hasta " +
                  salud.limite_mb +
                  " MB por archivo."
                : "El servidor no encuentra sus herramientas: " +
                  (salud.detalle || "");
          })
          .catch(function () {
            pie.textContent = "El servidor no responde.";
          });

        // ---------- arranque ----------

        elegirModo(modoActual);
      })();
    </script>
  </body>
</html>
