    />

    <style>
      /* Misma paleta Win98 que sisop.html, para que la ventana embebida no
         desentone con el resto del escritorio. */
      :root {
        --w98-face: #c9c5bb;
        --w98-face-lite: #e4e1d8;
        --w98-hilite: #ffffff;
        --w98-shadow: #808076;
        --w98-dkshadow: #3a3a34;
        --w98-field: #f7f5ef;
        --w98-selbg: #12305a;
        --w98-seltext: #f0ece4;
        --texto: #1b1b18;
        --apagado: #55554a;
        --alerta: #8c2f1f;
        --sans:
          "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

        /* Bisel "elevado" (botones en reposo) y su inverso "hundido"
           (pozos de contenido, estado presionado): mismas 4 capas que
           usa sisop.html para .btn / .tb-btn, nada inventado acá. */
        --bisel-elevado:
          inset -1px -1px 0 0 var(--w98-dkshadow),
          inset 1px 1px 0 0 var(--w98-hilite),
          inset -2px -2px 0 0 var(--w98-shadow),
          inset 2px 2px 0 0 var(--w98-face-lite);
        --bisel-hundido:
          inset 1px 1px 0 0 var(--w98-dkshadow),
          inset -1px -1px 0 0 var(--w98-hilite),
          inset 2px 2px 0 0 var(--w98-shadow),
          inset -2px -2px 0 0 var(--w98-face-lite);
      }

      * {
        box-sizing: border-box;
        cursor: default;
      }

      a,
      button {
        cursor: pointer;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--w98-field);
        color: var(--texto);
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 34rem;
        margin: 0 auto;
        padding: 2.5rem 1.5rem 4rem;
      }

      /* ---------- marca ---------- */

      .marca {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        margin-bottom: 1.75rem;
      }

      .marca-icono {
        width: 3.25rem;
        height: 3.25rem;
        flex: none;
        display: block;
      }

      .marca-titulo {
        font-family: var(--sans);
        font-size: 1.8rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--w98-selbg);
        margin: 0;
      }

      .marca-o {
        position: relative;
        display: inline-block;
        --o-desplazamiento: 0em;
      }

      .marca-o-letra {
        transition: opacity 0.15s ease;
      }

      .marca-o-icono {
        position: absolute;
        inset: 0;
        width: 0.7em;
        height: 0.72em;
        margin: auto;
        opacity: 0;
        transform: scale(0.7) translateY(var(--o-desplazamiento));
        transition:
          opacity 0.15s ease,
          transform 0.15s ease;
      }

      .marca-o.segunda {
        --o-desplazamiento: 0.05em;
      }

      .marca-o.mostrar-icono .marca-o-letra {
        opacity: 0;
      }

      .marca-o.mostrar-icono .marca-o-icono {
        opacity: 1;
        transform: scale(1) translateY(var(--o-desplazamiento));
      }

      .marca-o.asentado .marca-o-icono {
        transform: scale(1) rotate(16deg) translateY(var(--o-desplazamiento));
        transition: transform 0.28s ease;
      }

      /* ---------- animacion de tipeo del titulo ---------- */

      .letra {
        opacity: 0;
        transition: opacity 0.05s linear;
      }

      .letra.visible {
        opacity: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        .marca-o-letra,
        .marca-o-icono,
        .letra {
          transition: none;
        }
        .marca-o.asentado .marca-o-icono {
          transform: none;
        }
      }

      /* ---------- selector de modo ---------- */

      .selector {
        display: flex;
        gap: 0.3rem;
        flex-wrap: wrap;
      }

      .modo {
        padding: 0.5rem 0.9rem;
        border: 0;
        background: var(--w98-face);
        box-shadow: var(--bisel-elevado);
        font: inherit;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--texto);
        cursor: pointer;
      }

      .modo.activo {
        background: var(--w98-selbg);
        color: var(--w98-seltext);
        box-shadow: var(--bisel-hundido);
      }

      .modo:disabled {
        cursor: default;
        color: var(--w98-shadow);
        text-shadow: 1px 1px 0 var(--w98-hilite);
      }

      .modo:focus-visible {
        outline: 1px dotted var(--w98-dkshadow);
        outline-offset: -4px;
      }

      /* ---------- encabezado ---------- */

      #titulo {
        font-family: var(--sans);
        font-size: 1.7rem;
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: -0.01em;
        margin: 1.5rem 0 0;
      }

      #titulo .flecha {
        color: var(--w98-selbg);
      }

      .bajada {
        margin: 0.6rem 0 0;
        max-width: 26rem;
        color: var(--apagado);
        font-size: 0.9rem;
      }

      /* ---------- zona de archivo ---------- */

      .zona {
        margin-top: 2rem;
        border: 2px dashed var(--w98-selbg);
        background: var(--w98-field);
        box-shadow: var(--bisel-hundido);
        padding: 1.5rem 1.25rem;
        cursor: pointer;
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        color: inherit;
      }

      .zona.encima {
        background: var(--w98-face-lite);
      }

      .zona:focus-visible {
        outline: 1px dotted var(--w98-dkshadow);
        outline-offset: -4px;
      }

      .zona:disabled {
        cursor: default;
        color: var(--w98-shadow);
      }

      .zona-titulo {
        font-weight: 700;
      }

      .zona-detalle {
        margin-top: 0.35rem;
        color: var(--apagado);
        font-size: 0.85rem;
        word-break: break-word;
      }

      .lista-archivos {
        margin: 0.75rem 0 0;
        max-height: 11rem;
        overflow-y: auto;
        border-top: 1px solid var(--w98-shadow);
        border-bottom: 1px solid var(--w98-hilite);
      }

      .lista-archivos .fila {
        display: flex;
        gap: 0.6rem;
        padding: 0.35rem 0;
        border-bottom: 1px solid var(--w98-face-lite);
        font-size: 0.8rem;
      }

      .lista-archivos .num {
        color: var(--apagado);
        font-variant-numeric: tabular-nums;
        flex: none;
      }

      .lista-archivos .nom {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      input[type="file"] {
        display: none;
      }

      /* ---------- boton principal ---------- */

      .convertir {
        margin-top: 1rem;
        width: 100%;
        padding: 0.8rem 1rem;
        border: 0;
        background: var(--w98-face);
        box-shadow: var(--bisel-elevado);
        color: var(--texto);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .convertir:active:not(:disabled) {
        box-shadow: var(--bisel-hundido);
      }
      .convertir:disabled {
        color: var(--w98-shadow);
        text-shadow: 1px 1px 0 var(--w98-hilite);
        cursor: default;
      }
      .convertir:focus-visible {
        outline: 1px dotted var(--w98-dkshadow);
        outline-offset: -4px;
      }

      /* ---------- estado ---------- */

      .estado {
        margin-top: 2.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--w98-shadow);
      }

      .estado[hidden] {
        display: none;
      }

      .linea {
        display: flex;
        align-items: baseline;
        gap: 0.6rem;
        font-family: var(--sans);
        font-size: 1.2rem;
        font-weight: 700;
      }

      .punto {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: var(--w98-selbg);
        flex: none;
        transform: translateY(-0.15rem);
      }

      .trabajando .punto {
        animation: latido 1.4s ease-in-out infinite;
      }
      .fallo .punto {
        background: var(--alerta);
      }
      .fallo .linea {
        color: var(--alerta);
      }

      @keyframes latido {
        50% {
          opacity: 0.2;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .trabajando .punto {
          animation: none;
        }
      }

      .reloj {
        margin-left: auto;
        font-family: var(--sans);
        font-size: 0.85rem;
        font-weight: 400;
        font-variant-numeric: tabular-nums;
        color: var(--apagado);
      }

      .nota {
        margin: 0.5rem 0 0;
        color: var(--apagado);
        font-size: 0.85rem;
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* ---------- barra de progreso ---------- */

      .progreso {
        margin-top: 0.75rem;
        height: 1.15rem;
        background: var(--w98-field);
        box-shadow: var(--bisel-hundido);
        padding: 2px;
      }

      .progreso[hidden] {
        display: none;
      }

      .progreso-relleno {
        height: 100%;
        width: 0%;
        background-color: var(--w98-selbg);
        background-image: repeating-linear-gradient(
          90deg,
          var(--w98-selbg) 0px,
          var(--w98-selbg) 7px,
          var(--w98-field) 7px,
          var(--w98-field) 9px
        );
        transition: width 0.2s ease-out;
      }

      /* Sin porcentaje real durante "en cola"/"convirtiendo": un bloque va y
         viene, como el progreso indeterminado clasico de Windows 98. */
      .progreso.indeterminado .progreso-relleno {
        width: 35% !important;
        transition: none;
        animation: marquee 1.3s ease-in-out infinite;
      }

      @keyframes marquee {
        0%,
        100% {
          margin-left: 0%;
        }
        50% {
          margin-left: 65%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .progreso.indeterminado .progreso-relleno {
          animation: none;
          margin-left: 0%;
          width: 100% !important;
        }
      }

      .fallo .progreso-relleno {
        background-color: var(--alerta);
        background-image: repeating-linear-gradient(
          90deg,
          var(--alerta) 0px,
          var(--alerta) 7px,
          var(--w98-field) 7px,
          var(--w98-field) 9px
        );
      }

      .acciones {
        margin-top: 1.25rem;
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
      }

      .acciones[hidden] {
        display: none;
      }

      .descargar {
        display: inline-block;
        padding: 0.7rem 1.3rem;
        background: var(--w98-face);
        box-shadow: var(--bisel-elevado);
        color: var(--texto);
        text-decoration: none;
        font-weight: 700;
      }

      .descargar[hidden] {
        display: none;
      }

      .descargar:active {
        box-shadow: var(--bisel-hundido);
      }

      .otro {
        padding: 0.7rem 1.3rem;
        border: 0;
        background: var(--w98-face);
        box-shadow: var(--bisel-elevado);
        font: inherit;
        cursor: pointer;
        color: var(--texto);
      }

      .otro:active {
        box-shadow: var(--bisel-hundido);
      }

      .descargar:focus-visible,
      .otro:focus-visible {
        outline: 1px dotted var(--w98-dkshadow);
        outline-offset: -4px;
      }

      footer {
        margin-top: 3rem;
        color: var(--apagado);
        font-size: 0.8rem;
      }
    </style>
  </head>

    <script>
      (function () {
        "use strict";

        const MODOS = {
          "pdf-a-epub": {
            titulo: 'De PDF <span class="flecha">a EPUB</span>',
            bajada: "Elegí un PDF y lo convertimos a EPUB.",
            accept: ".pdf,application/pdf",
            multiple: false,
            regex: /\.pdf$/i,
            invalido: "Ese archivo no es un PDF.",
            zonaVacia: "Elegí un PDF",
            zonaVaciaDetalle: "o arrastralo hasta acá",
            uno: "PDF elegido",
            varios: null,
            descargaLabel: "Descargar EPUB",
          },
          "imagen-a-pdf": {
            titulo: 'De imágenes <span class="flecha">a PDF</span>',
            bajada:
              "Elegí una o varias imágenes (JPG o PNG) y se convierten en un solo PDF, una página por imagen, en el orden en que las elegiste.",
            accept: ".jpg,.jpeg,.png,image/jpeg,image/png",
            multiple: true,
            regex: /\.(jpe?g|png)$/i,
            invalido: "Eso no son imágenes JPG o PNG.",
            zonaVacia: "Elegí una o más imágenes",
            zonaVaciaDetalle: "o arrastralas hasta acá",
            uno: "imagen elegida",
            varios: "imágenes elegidas",
            descargaLabel: "Descargar PDF",
          },
          "doc-a-pdf": {
            titulo: 'De documento <span class="flecha">a PDF</span>',
            bajada:
              "Elegí un documento de texto (TXT, DOCX, ODT o RTF) y se convierte a PDF.",
            accept: ".txt,.docx,.odt,.rtf",
            multiple: false,
            regex: /\.(txt|docx|odt|rtf)$/i,
            invalido: "Ese archivo no es un TXT, DOCX, ODT ni RTF.",
            zonaVacia: "Elegí un documento",
            zonaVaciaDetalle: "o arrastralo hasta acá",
            uno: "documento elegido",
            varios: null,
            descargaLabel: "Descargar PDF",
          },
        };

        const botonesModo = document.querySelectorAll(".modo");
        const titulo = document.getElementById("titulo");
        const bajada = document.getElementById("bajada");
        const entrada = document.getElementById("archivo");
        const zona = document.getElementById("zona");
        const zonaTitulo = document.getElementById("zonaTitulo");
        const zonaDetalle = document.getElementById("zonaDetalle");
        const listaArchivos = document.getElementById("listaArchivos");
        const botonEnviar = document.getElementById("convertir");
        const panel = document.getElementById("estado");
        const texto = document.getElementById("estadoTexto");
        const nota = document.getElementById("nota");
        const reloj = document.getElementById("reloj");
        const acciones = document.getElementById("acciones");
        const progreso = document.getElementById("progreso");
        const progresoRelleno = document.getElementById("progresoRelleno");
        const enlace = document.getElementById("descargar");
        const botonOtro = document.getElementById("otro");
        const pie = document.getElementById("pie");

        const ESPERA_MS = 2000; // cada cuanto le preguntamos al servidor
        let modoActual = "pdf-a-epub";
        let elegidos = [];
        let cronometro = null;
        let arranque = 0;

        // ---------- utilidades ----------

        function tamano(bytes) {
          const mb = bytes / (1024 * 1024);
          return mb >= 1
            ? mb.toFixed(1) + " MB"
            : Math.max(1, Math.round(bytes / 1024)) + " KB";
        }

        function escapar(texto) {
          const d = document.createElement("div");
          d.textContent = texto;
          return d.innerHTML;
        }

        function iniciarReloj() {
          arranque = Date.now();
          reloj.textContent = "0:00";
          cronometro = setInterval(function () {
            const seg = Math.floor((Date.now() - arranque) / 1000);
            reloj.textContent =
              Math.floor(seg / 60) + ":" + String(seg % 60).padStart(2, "0");
          }, 1000);
        }

        function pararReloj() {
          clearInterval(cronometro);
          cronometro = null;
        }

        function pintar(clase, titulo, detalle) {
          panel.hidden = false;
          panel.className = "estado" + (clase ? " " + clase : "");
          texto.textContent = titulo;
          nota.textContent = detalle || "";
        }

        // ---------- barra de progreso ----------

        function mostrarProgreso() {
          progreso.hidden = false;
          progreso.classList.remove("indeterminado");
          progresoRelleno.style.width = "0%";
        }

        function fijarProgreso(fraccion) {
          progresoRelleno.style.width =
            Math.max(0, Math.min(1, fraccion)) * 100 + "%";
        }

        function progresoIndeterminado() {
          progreso.hidden = false;
          progreso.classList.add("indeterminado");
        }

        function progresoCompleto() {
          progreso.classList.remove("indeterminado");
          progresoRelleno.style.width = "100%";
        }

        function ocultarProgreso() {
          progreso.hidden = true;
          progreso.classList.remove("indeterminado");
          progresoRelleno.style.width = "0%";
        }

        function fallar(detalle) {
          pararReloj();
          pintar("fallo", "No se pudo convertir", detalle);
          progreso.classList.remove("indeterminado");
          acciones.hidden = false;
          enlace.hidden = true;
          botonEnviar.disabled = false;
          zona.disabled = false;
          botonesModo.forEach(function (boton) {
            boton.disabled = false;
          });
        }

        // ---------- cambio de modo ----------

        function elegirModo(modo) {
          modoActual = modo;
          const config = MODOS[modo];

          botonesModo.forEach(function (boton) {
            boton.classList.toggle("activo", boton.dataset.modo === modo);
          });

          titulo.innerHTML = config.titulo;
          bajada.textContent = config.bajada;
          entrada.accept = config.accept;
          entrada.multiple = config.multiple;
          enlace.textContent = config.descargaLabel;

          elegidos = [];
          entrada.value = "";
          zonaTitulo.textContent = config.zonaVacia;
          zonaDetalle.textContent = config.zonaVaciaDetalle;
          listaArchivos.hidden = true;
          listaArchivos.innerHTML = "";
          zona.disabled = false;
          botonEnviar.disabled = true;
          panel.hidden = true;
          pararReloj();
          ocultarProgreso();
        }

        botonesModo.forEach(function (boton) {
          boton.addEventListener("click", function () {
            elegirModo(boton.dataset.modo);
          });
        });

        // ---------- eleccion de los archivos ----------

        function tomar(archivos) {
          const config = MODOS[modoActual];
          const lista = Array.from(archivos || []);
          if (!lista.length) return;

          let validos = lista.filter(function (archivo) {
            return config.regex.test(archivo.name);
          });
          if (!validos.length) {
            zonaDetalle.textContent = config.invalido;
            return;
          }

          let recorte = false;
          if (!config.multiple && validos.length > 1) {
            validos = validos.slice(0, 1);
            recorte = true;
          }

          elegidos = validos;

          const totalBytes = validos.reduce(function (suma, a) {
            return suma + a.size;
          }, 0);

          zonaTitulo.textContent =
            validos.length === 1
              ? "1 " + config.uno
              : validos.length + " " + config.varios;

          let notaExtra = "";
          if (recorte) {
            notaExtra = " · se usó solo el primero";
          } else if (validos.length < lista.length) {
            notaExtra =
              " · se ignoraron " +
              (lista.length - validos.length) +
              " que no valían";
          }
          zonaDetalle.textContent = tamano(totalBytes) + notaExtra;

          if (validos.length > 1) {
            listaArchivos.innerHTML = validos
              .map(function (archivo, indice) {
                return (
                  '<div class="fila"><span class="num">' +
                  (indice + 1) +
                  '.</span><span class="nom">' +
                  escapar(archivo.name) +
                  "</span></div>"
                );
              })
              .join("");
            listaArchivos.hidden = false;
          } else {
            listaArchivos.hidden = true;
            listaArchivos.innerHTML = "";
          }

          botonEnviar.disabled = false;
        }

        zona.addEventListener("click", function () {
          entrada.click();
        });
        entrada.addEventListener("change", function () {
          tomar(entrada.files);
        });

        ["dragenter", "dragover"].forEach(function (evento) {
          zona.addEventListener(evento, function (e) {
            e.preventDefault();
            zona.classList.add("encima");
          });
        });

        ["dragleave", "drop"].forEach(function (evento) {
          zona.addEventListener(evento, function (e) {
            e.preventDefault();
            zona.classList.remove("encima");
          });
        });

        zona.addEventListener("drop", function (e) {
          if (e.dataTransfer.files.length) tomar(e.dataTransfer.files);
        });

        // ---------- 1) subir ----------

        // fetch() no expone progreso de subida en todos los navegadores;
        // XMLHttpRequest sí, vía xhr.upload.onprogress.
        function subirConProgreso(url, formData, alProgresar) {
          return new Promise(function (resolve, reject) {
            const xhr = new XMLHttpRequest();
            xhr.open("POST", url);
            xhr.upload.addEventListener("progress", function (e) {
              if (e.lengthComputable) alProgresar(e.loaded / e.total);
            });
            xhr.addEventListener("load", function () {
              let datos = {};
              try {
                datos = JSON.parse(xhr.responseText);
              } catch (error) {
                datos = {};
              }
              if (xhr.status >= 200 && xhr.status < 300) {
                resolve(datos);
              } else {
                reject(
                  datos.detail || "El servidor respondió " + xhr.status + ".",
                );
              }
            });
            xhr.addEventListener("error", function () {
              reject(
                "No se pudo contactar al servidor. Fijate que siga corriendo.",
              );
            });
            xhr.send(formData);
          });
        }

        botonEnviar.addEventListener("click", async function () {
          if (!elegidos.length) return;
          const config = MODOS[modoActual];

          botonEnviar.disabled = true;
          zona.disabled = true;
          botonesModo.forEach(function (boton) {
            boton.disabled = true;
          });
          acciones.hidden = true;
          enlace.hidden = false;
          const detalle =
            elegidos.length === 1
              ? elegidos[0].name
              : elegidos.length + " " + config.varios;
          pintar("trabajando", "Subiendo", detalle);
          mostrarProgreso();
          iniciarReloj();

          const cuerpo = new FormData();
          elegidos.forEach(function (archivo) {
            cuerpo.append("archivos", archivo);
          });

          let trabajo;
          try {
            trabajo = await subirConProgreso(
              "/convert/" + modoActual,
              cuerpo,
              fijarProgreso,
            );
          } catch (error) {
            fallar(typeof error === "string" ? error : "Error desconocido.");
            return;
          }

          pintar("trabajando", "En cola", detalle);
          progresoIndeterminado();
          consultar(trabajo.id);
        });

        // ---------- 2) preguntar el estado ----------

        function etiqueta(trabajo) {
          if (trabajo.cantidad === 1) return trabajo.archivo;
          const config = MODOS[trabajo.tipo] || {};
          return trabajo.cantidad + " " + (config.varios || "archivos");
        }

        async function consultar(id) {
          let trabajo;
          try {
            const respuesta = await fetch("/jobs/" + id);
            if (respuesta.status === 404) {
              fallar(
                "El servidor se reinició y perdió este trabajo. Probá de nuevo.",
              );
              return;
            }
            trabajo = await respuesta.json();
          } catch (error) {
            fallar("Se cortó la conexión con el servidor.");
            return;
          }

          if (trabajo.estado === "completado") {
            pararReloj();
            pintar("", "Listo", etiqueta(trabajo));
            progresoCompleto();
            enlace.href = "/jobs/" + id + "/descarga";
            enlace.hidden = false;
            acciones.hidden = false;
            botonesModo.forEach(function (boton) {
              boton.disabled = false;
            });
            return;
          }

          if (trabajo.estado === "error") {
            fallar(trabajo.error || "La conversión no devolvió un motivo.");
            return;
          }

          pintar(
            "trabajando",
            trabajo.estado === "en_cola" ? "En cola" : "Convirtiendo",
            etiqueta(trabajo),
          );
          setTimeout(function () {
            consultar(id);
          }, ESPERA_MS);
        }

        // ---------- 3) volver a empezar ----------

        botonOtro.addEventListener("click", function () {
          elegirModo(modoActual);
        });

        // ---------- estado del servidor ----------

        // El plan gratis de Render "duerme" el servidor si nadie lo usa: la
        // primera consulta después de eso puede tardar hasta un minuto en
        // responder, y mientras tanto puede devolver un error transitorio.
        // Reintentamos con espera creciente en vez de rendirnos al primer
        // intento fallido.
        const REINTENTOS_SALUD = 8;

        function comprobarSalud(intento) {
          intento = intento || 0;
          fetch("/health")
            .then(function (r) {
              return r.json();
            })
            .then(function (salud) {
              pie.textContent =
                salud.estado === "ok"
                  ? "Servidor listo. Hasta " +
                    salud.limite_mb +
                    " MB por archivo."
                  : "El servidor no encuentra sus herramientas: " +
                    (salud.detalle || "");
            })
            .catch(function () {
              if (intento < REINTENTOS_SALUD) {
                setTimeout(
                  function () {
                    comprobarSalud(intento + 1);
                  },
                  2000 + intento * 2000,
                );
                return;
              }
              pie.textContent =
                "El servidor no responde. Recargá la página en un rato.";
            });
        }

        comprobarSalud();

        // ---------- animacion de tipeo del titulo ----------

        function animarTitulo() {
          const letras = document.querySelectorAll(".marca-titulo .letra");
          const oes = document.querySelectorAll(".marca-o");
          const reducido = window.matchMedia(
            "(prefers-reduced-motion: reduce)",
          ).matches;

          if (reducido) {
            letras.forEach(function (l) {
              l.classList.add("visible");
            });
            oes.forEach(function (o) {
              o.classList.add("mostrar-icono");
            });
            return;
          }

          const PASO_MS = 85;
          let i = 0;
          function siguienteLetra() {
            if (i < letras.length) {
              letras[i].classList.add("visible");
              i++;
              setTimeout(siguienteLetra, PASO_MS);
              return;
            }
            setTimeout(function () {
              oes.forEach(function (o) {
                o.classList.add("mostrar-icono");
              });
              setTimeout(function () {
                oes.forEach(function (o) {
                  o.classList.add("asentado");
                });
              }, 200);
            }, 300);
          }
          siguienteLetra();
        }

        // ---------- arranque ----------

        elegirModo(modoActual);
        animarTitulo();
      })();
    </script>
  </body>
</html>
